<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물과 기름을 크림으로 · 13주차 에멀전 퀴즈</title>
<style>
:root{
  --water:#2F86B5; --water-soft:#E8F3F9; --oil:#E3A12F; --oil-soft:#FDF3E1;
  --ink:#1D2B33; --sub:#5E6E77; --line:#DCE6EB; --bg:#F7FAFC;
  --ok:#2E9E6A; --ok-soft:#E5F5EC; --no:#D64545; --no-soft:#FCEAEA;
  --r:14px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:680px;margin:0 auto;padding:20px 18px 40px}

/* header */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.course{font-size:13px;color:var(--sub)}
h1{font-size:clamp(22px,5.4vw,28px);line-height:1.25;letter-spacing:-.02em;margin-top:4px}
.score{flex:none;text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 14px;min-width:92px}
.score b{display:block;font-size:26px;line-height:1.1;color:var(--water);font-variant-numeric:tabular-nums}
.score span{font-size:12px;color:var(--sub)}
.score.bump b{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.35);color:var(--oil)}}
.plus{position:absolute;font-weight:700;color:var(--oil);pointer-events:none;animation:rise .9s forwards}
@keyframes rise{to{transform:translateY(-28px);opacity:0}}

/* progress */
.progress{margin-bottom:18px}
.progress-top{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:8px}
.progress-top strong{color:var(--ink)}
.drops{display:flex;gap:6px}
.drop{flex:1;height:10px;border-radius:99px;background:var(--line);transition:background .25s}
.drop.now{background:var(--oil)}
.drop.ok{background:var(--water)}
.drop.no{background:var(--no)}

/* card */
.card{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:22px 20px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--water-soft);color:var(--water);font-weight:600}
.tag.hard{background:var(--oil-soft);color:#A8700F}
.tag.retry{background:var(--no-soft);color:var(--no)}
.q{font-size:clamp(17px,4.4vw,19px);font-weight:700;letter-spacing:-.01em;margin-bottom:18px}
.q .blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--oil);margin:0 4px;text-align:center;color:var(--oil)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;
  transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--water);background:var(--water-soft)}
.opt:focus-visible{outline:3px solid var(--oil);outline-offset:2px}
.opt .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;
  background:var(--bg);color:var(--sub)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .n{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-soft)}
.opt.no .n{background:var(--no);color:#fff}
.opt.dim{opacity:.55}

.feedback{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:15px;display:none}
.feedback.show{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.feedback.ok{background:var(--ok-soft)}
.feedback.no{background:var(--no-soft)}
.feedback .verdict{font-weight:800;margin-bottom:4px}
.feedback.ok .verdict{color:var(--ok)}
.feedback.no .verdict{color:var(--no)}

.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;padding:14px 20px;cursor:pointer;flex:1;min-width:150px;white-space:nowrap}
.btn:focus-visible{outline:3px solid var(--oil);outline-offset:2px}
.btn.main{background:var(--water);color:#fff}
.btn.main:hover{background:#27729B}
.btn.warm{background:var(--oil);color:#fff}
.btn.warm:hover{background:#CC8C1F}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.hidden{display:none!important}

/* result */
.result h2{font-size:22px;margin-bottom:6px}
.result p.lead{color:var(--sub);margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--sub)}
.review{list-style:none;padding:0;display:grid;gap:8px;margin-bottom:6px}
.review li{background:var(--no-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.review li b{color:var(--no)}
.review li small{display:block;color:var(--sub);margin-top:2px}
.foot{font-size:12px;color:var(--sub);text-align:center;margin-top:22px}

/* oil-in-water backdrop motif */
.hero-drops{position:fixed;inset:auto -40px -40px auto;width:220px;height:220px;border-radius:50%;background:var(--water-soft);z-index:-1}
.hero-drops::before,.hero-drops::after{content:"";position:absolute;border-radius:50%;background:var(--oil-soft)}
.hero-drops::before{width:60px;height:60px;top:40px;left:50px}
.hero-drops::after{width:34px;height:34px;top:110px;left:120px}

@media (max-width:420px){
  .wrap{padding:14px 12px 32px}
  .card{padding:18px 14px}
  .score{min-width:78px;padding:6px 10px}
  .score b{font-size:22px}
  .opt{font-size:15px;padding:12px}
  .btn{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="hero-drops" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div>
      <div class="course">제품 및 소재 물성 실습 · 13주차 형성평가</div>
      <h1>물과 기름을 크림으로<br>에멀전 조제 퀴즈</h1>
    </div>
    <div class="score" id="scoreBox" aria-live="polite"><b id="score">0</b><span>포인트</span></div>
  </header>

  <div class="progress" id="progressWrap">
    <div class="progress-top"><span id="progLabel"><strong>1</strong> / 10 문항</span><span id="progMode">첫 번째 풀기</span></div>
    <div class="drops" id="drops" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1"></div>
  </div>

  <main id="quiz" class="card">
    <div class="meta" id="meta"></div>
    <div class="q" id="question"></div>
    <div class="opts" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite">
      <div class="verdict" id="verdict"></div>
      <div id="explain"></div>
    </div>
    <div class="actions"><button class="btn main hidden" id="nextBtn">다음 문항</button></div>
  </main>

  <section id="result" class="card result hidden" aria-live="polite">
    <h2 id="resTitle"></h2>
    <p class="lead" id="resLead"></p>
    <div class="stats">
      <div class="stat"><b id="resScore">0</b><span>포인트</span></div>
      <div class="stat"><b id="resRight" style="color:var(--ok)">0</b><span>맞힌 문항</span></div>
      <div class="stat"><b id="resWrong" style="color:var(--no)">0</b><span>남은 오답</span></div>
    </div>
    <ul class="review" id="review"></ul>
    <div class="actions">
      <button class="btn warm" id="retryBtn">틀린 문항만 다시 풀기</button>
      <button class="btn ghost" id="restartBtn">처음부터 다시 풀기</button>
    </div>
  </section>

  <p class="foot">첫 풀이 정답 +10점 · 다시 풀기 정답 +5점 · 보기 번호는 키보드 1~4로도 고를 수 있어요</p>
</div>

<script>
const Q = [
  {t:"보습크림 처방에서 유상(기름 쪽) 성분이 아닌 것은?", lv:"중", o:["세틸알코올","미네랄오일","스쿠알란","부틸렌글라이콜(BG)"], a:3,
   e:"BG는 글리세린과 함께 수분을 붙잡는 수상(물 쪽) 성분이에요."},
  {t:"보습크림 처방에서 유화제의 권장 비율로 옳은 것은?", lv:"중", o:["3~10%","1~2%","10~20%","70~85%"], a:0,
   e:"유상 10~20% : 유화제 3~10% : 수상 70~85% — 오늘 처방의 유화제 4.5%도 이 범위 안이에요."},
  {t:"O/W 보습크림에서 유상(기름)의 비율을 늘렸을 때 나타나는 변화로 옳은 것은?", lv:"상",
   o:["크림이 묽어지고 부드러워진다","점도와 보습감이 커지지만, 물과 기름이 분리될 위험도 커진다","유화제의 양은 줄여야 한다","물의 양이 줄어 보습 효과가 사라진다"], a:1,
   e:"기름이 많으면 되기·보습감은 오르지만 분리 위험도 커져요. 보습은 물이 아니라 글리세린·BG가 담당해요."},
  {t:"오늘 만드는 O/W 보습크림이 보통 목표로 하는 HLB 범위는?", lv:"중", o:["3~6","15~18","9~12","0~3"], a:2,
   e:"O/W 유화는 HLB 8~18, 그중 크림은 보통 9~12를 목표로 해요."},
  {t:"Tween 60(HLB 14.9)과 Span 60(HLB 4.7)을 섞어 목표 HLB 12.35를 만들려고 한다. 두 유화제의 비율로 옳은 것은?", lv:"상",
   o:["Tween 60 75% : Span 60 25%","Tween 60 25% : Span 60 75%","Tween 60 50% : Span 60 50%","Tween 60 83% : Span 60 17%"], a:0,
   e:"Tween 60 비율 = (12.35 − 4.7) ÷ (14.9 − 4.7) = 0.75 → Tween 60 75%, Span 60 25%."},
  {t:"보습크림 조제 시 안전수칙 및 유의사항으로 옳지 않은 것은?", lv:"상",
   o:["70~75°C로 가열한 비커는 내열장갑이나 집게로 잡는다","소독용 알코올은 불이 붙기 쉬우므로 완전히 마른 뒤 가열한다","수상과 유상의 온도 차이가 생기지 않도록 수상을 한꺼번에 빠르게 붓는다","가열 중 수분이 증발하지 않도록 비커 입구를 호일로 덮는다"], a:2,
   e:"수상은 조금씩 천천히 넣어야 해요. 온도는 섞기 전에 미리 비슷하게 맞춰 둡니다."},
  {t:"오늘 만드는 보습크림처럼 물속에 기름방울이 고르게 퍼져 있는 에멀전을 ___형이라 한다.", lv:"중", o:["O/W","W/O"], a:0, blank:true,
   e:"O/W = Oil in Water. 앞 글자(Oil)가 방울, 뒤 글자(Water)가 바깥이에요."},
  {t:"마요네즈가 분리되지 않는 것은 달걀노른자에 들어 있는 ___이(가) 유화제 역할을 하기 때문이다.", lv:"중", o:["단백질","레시틴","글리세린","세라마이드"], a:1, blank:true,
   e:"달걀노른자의 레시틴(인지질)이 천연 유화제로 기름방울을 감싸 분리를 막아요."},
  {t:"향료·보존제·기능성 성분은 열에 약하므로, 유화 후 저으면서 식혀 반드시 ___°C 이하에서 넣는다.", lv:"중", o:["75","70","40","25"], a:2, blank:true,
   e:"유화는 70~75°C에서, 열에 약한 성분은 40°C 이하로 식힌 뒤 넣어요."},
  {t:"Tween 60(HLB 14.9) 60%와 Span 60(HLB 4.7) 40%를 섞은 유화제 혼합물의 HLB는 ___이다.", lv:"상", o:["9.80","10.82","12.35","8.94"], a:1, blank:true,
   e:"14.9 × 0.60 + 4.7 × 0.40 = 8.94 + 1.88 = 10.82 (단순 평균 9.8은 오답)"}
];
const NUM = ["①","②","③","④"];
const $ = id => document.getElementById(id);

let score = 0, queue = [], pos = 0, round = 1, status = {}, wrongNow = [], answered = false;

function start(){
  score = 0; round = 1; status = {};
  $("score").textContent = 0;
  begin(Q.map((_,i)=>i));
}
function begin(list){
  queue = list; pos = 0; wrongNow = [];
  $("result").classList.add("hidden"); $("quiz").classList.remove("hidden"); $("progressWrap").classList.remove("hidden");
  $("progMode").textContent = round === 1 ? "첫 번째 풀기" : `틀린 문항 다시 풀기 (${round-1}회차)`;
  buildDrops(); show();
}
function buildDrops(){
  $("drops").innerHTML = queue.map(()=>'<div class="drop"></div>').join("");
  $("drops").setAttribute("aria-valuemax", queue.length);
}
function paintDrops(){
  [...$("drops").children].forEach((d,i)=>{
    d.className = "drop" + (i === pos && !answered ? " now" : "") +
      (d.dataset.r ? " " + d.dataset.r : "");
  });
}
function show(){
  answered = false;
  const qi = queue[pos], q = Q[qi];
  $("progLabel").innerHTML = `<strong>${pos+1}</strong> / ${queue.length} 문항`;
  $("drops").setAttribute("aria-valuenow", pos+1);
  paintDrops();
  $("meta").innerHTML = `<span class="tag">${qi+1}번</span><span class="tag ${q.lv==="상"?"hard":""}">난이도 ${q.lv}</span>` +
    (q.blank ? '<span class="tag">빈칸 채우기</span>' : '') + (round > 1 ? '<span class="tag retry">다시 풀기</span>' : '');
  $("question").innerHTML = q.blank ? q.t.replace("___", '<span class="blank">?</span>') : q.t;
  $("options").innerHTML = q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${NUM[i]}</span><span>${o}</span></button>`).join("");
  [...$("options").children].forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.i)));
  $("feedback").className = "feedback";
  $("nextBtn").classList.add("hidden");
  $("options").firstElementChild.focus({preventScroll:true});
}
function choose(i){
  if(answered) return; answered = true;
  const qi = queue[pos], q = Q[qi], ok = i === q.a;
  [...$("options").children].forEach((b,k)=>{
    b.disabled = true;
    if(k === q.a) b.classList.add("ok");
    else if(k === i) b.classList.add("no");
    else b.classList.add("dim");
  });
  if(q.blank && ok) $("question").querySelector(".blank").textContent = q.o[q.a];
  const drop = $("drops").children[pos]; drop.dataset.r = ok ? "ok" : "no";
  paintDrops();
  if(ok){ const pts = round === 1 ? 10 : 5; score += pts; status[qi] = "ok"; bump(pts); }
  else { status[qi] = "no"; wrongNow.push(qi); }
  $("feedback").className = "feedback show " + (ok ? "ok" : "no");
  $("verdict").textContent = ok ? "정답이에요!" : `아쉬워요. 정답은 ${NUM[q.a]} ${q.o[q.a]}`;
  $("explain").textContent = q.e;
  const nb = $("nextBtn");
  nb.textContent = pos === queue.length - 1 ? "결과 보기" : "다음 문항";
  nb.classList.remove("hidden"); nb.focus({preventScroll:true});
  $("feedback").scrollIntoView({behavior:"smooth", block:"nearest"});
}
function bump(pts){
  $("score").textContent = score;
  const box = $("scoreBox"); box.classList.remove("bump"); void box.offsetWidth; box.classList.add("bump");
  const p = document.createElement("div"); p.className = "plus"; p.textContent = "+" + pts;
  const r = box.getBoundingClientRect();
  p.style.left = (r.left + window.scrollX + r.width/2 - 14) + "px"; p.style.top = (r.top + window.scrollY - 6) + "px";
  document.body.appendChild(p); setTimeout(()=>p.remove(), 900);
}
function next(){
  if(pos < queue.length - 1){ pos++; show(); window.scrollTo({top:0, behavior:"smooth"}); }
  else finish();
}
function finish(){
  $("quiz").classList.add("hidden"); $("progressWrap").classList.add("hidden");
  $("result").classList.remove("hidden");
  const right = Object.values(status).filter(s=>s==="ok").length, left = wrongNow.length;
  $("resScore").textContent = score; $("resRight").textContent = right; $("resWrong").textContent = left;
  if(left === 0){
    $("resTitle").textContent = round === 1 ? "10문항 모두 정답! 🎉" : "오답을 모두 해결했어요! 🎉";
    $("resLead").textContent = "에멀전 조제의 핵심을 잘 이해했어요. 실습에서 그대로 적용해 보세요.";
  } else {
    $("resTitle").textContent = `${left}문항을 다시 확인해 볼까요?`;
    $("resLead").textContent = "아래 문항은 정답과 해설을 한 번 더 읽고 다시 풀어 보세요.";
  }
  $("review").innerHTML = wrongNow.map(qi=>{ const q = Q[qi];
    return `<li><b>${qi+1}번</b> ${q.t.replace("___","(　　)")}<small>정답: ${NUM[q.a]} ${q.o[q.a]}</small></li>`; }).join("");
  $("retryBtn").classList.toggle("hidden", left === 0);
  window.scrollTo({top:0, behavior:"smooth"});
}
$("nextBtn").addEventListener("click", next);
$("retryBtn").addEventListener("click", ()=>{ round++; begin(wrongNow.slice()); });
$("restartBtn").addEventListener("click", start);
document.addEventListener("keydown", e=>{
  if($("quiz").classList.contains("hidden")) return;
  const k = parseInt(e.key, 10);
  if(!answered && k >= 1 && k <= Q[queue[pos]].o.length) choose(k-1);
  else if(answered && e.key === "Enter" && document.activeElement !== $("nextBtn")) next();
});
start();
</script>
</body>
</html>
