<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>색을 숫자로 읽기 · 색도 형성평가 퀴즈</title>
<style>
:root{
  --bg:#ffffff; --surface:#f4f6fb; --line:#e2e6f0; --ink:#1c2440; --muted:#5d6480;
  --red:#e5484d; --green:#23a049; --yellow:#f2b705; --blue:#3e7ce0;
  --ok-bg:#eaf7ee; --ok:#1b7f3a; --no-bg:#fdecec; --no:#c0343a;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 40px}

/* header */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}
.lab{width:46px;height:46px;flex:none;position:relative}
.lab span{position:absolute;width:26px;height:26px;border-radius:50%;mix-blend-mode:multiply;opacity:.85}
.lab .r{background:var(--red);left:0;top:0}.lab .g{background:var(--green);right:0;top:0}.lab .b{background:var(--blue);left:10px;bottom:0}
h1{font-size:clamp(20px,5vw,26px);margin:0;line-height:1.25;letter-spacing:-.02em}
.sub{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.score{flex:none;text-align:center;background:var(--ink);color:#fff;border-radius:var(--radius);padding:8px 14px;min-width:84px}
.score small{display:block;font-size:11.5px;opacity:.75}
.score b{font-size:24px;display:inline-block;font-variant-numeric:tabular-nums}
.score.bump b{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.35);color:var(--yellow)}}
.plus{position:fixed;pointer-events:none;font-weight:800;color:var(--ok);font-size:20px;animation:rise .9s ease forwards}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}

/* progress */
.prog{margin-bottom:18px}
.prog-top{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:7px}
.prog-top strong{color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.chip{height:10px;border-radius:5px;background:var(--line);transition:background .3s}
.chip.now{background:#b9c3dc;outline:2px solid var(--ink);outline-offset:1px}
.chip.ok{background:var(--green)}.chip.no{background:var(--red)}

/* card */
.card{background:var(--surface);border-radius:18px;padding:22px 20px}
.tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.tag.hi{color:var(--red);border-color:#f3c2c4}
.q{font-size:clamp(17px,4.4vw,19.5px);font-weight:700;line-height:1.55;margin:0 0 6px;word-break:keep-all}
.hint{font-size:13px;color:var(--muted);margin:0 0 14px}
.formula{display:inline-block;background:#fff;border:1px dashed #b9c3dc;border-radius:10px;padding:6px 10px;font-weight:700;color:var(--blue);margin:2px 0 14px;font-size:15px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer;min-height:52px;word-break:keep-all}
.opt:hover:not(:disabled){border-color:#9fb0d8}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-weight:800;font-size:14px}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .n{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .n{background:var(--no);color:#fff}
.opt.dim{opacity:.55}

.fb{margin-top:14px;border-radius:12px;padding:14px 15px;font-size:15px;line-height:1.6;display:none}
.fb.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.fb.ok{background:var(--ok-bg);color:#154d27}.fb.no{background:var(--no-bg);color:#6b1e22}
.fb b.v{display:block;font-size:16.5px;margin-bottom:3px}
.fb .tip{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08);font-size:14px}

.actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:16px;border:none;border-radius:12px;padding:13px 20px;cursor:pointer;min-height:50px}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn[hidden]{display:none}

/* result */
.result h2{margin:0 0 4px;font-size:22px}
.big{font-size:56px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--muted);font-weight:700}
.msg{color:var(--muted);margin:0 0 16px;font-size:15px}
.list{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:7px}
.list li{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.5}
.mark{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.mark.ok{background:var(--green)}.mark.no{background:var(--red)}
.list .ans{color:var(--muted);font-size:13px}
.retry-note{font-size:13px;color:var(--muted);margin-top:10px}
footer{margin-top:22px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="lab" aria-hidden="true"><span class="r"></span><span class="g"></span><span class="b"></span></div>
      <div>
        <h1>색을 숫자로 읽기</h1>
        <p class="sub">품질요소 ① 색도 기초이론 형성평가 · 10문항</p>
      </div>
    </div>
    <div class="score" id="scoreBox" aria-live="polite"><small>포인트</small><b id="score">0</b></div>
  </header>

  <section class="prog" aria-label="진행률">
    <div class="prog-top"><span id="progLabel"><strong>1</strong> / 10 문항</span><span id="okCount">맞힌 문항 0</span></div>
    <div class="chips" id="chips"></div>
  </section>

  <main id="stage"></main>
  <footer>제품 및 소재 물성 실습 · 유한생명바이오학과</footer>
</div>

<script>
const Q = [
 {type:"객관식",lv:"중",q:"L*a*b* 색 공간에서 a* 값이 +(플러스) 쪽으로 커질수록 색은 어느 쪽으로 변할까요?",
  o:["빨강","초록","노랑","파랑"],a:0,
  why:"a*는 빨강(+) ↔ 초록(−) 축이에요. +가 커질수록 빨간 쪽입니다.",
  trap:{2:"노랑(+) ↔ 파랑(−)은 b* 축이에요. a*와 b*를 헷갈리지 마세요."}},
 {type:"괄호넣기",lv:"중",q:"L* 값은 밝기를 나타내며, 0은 검정, (　　　)은/는 흰색을 뜻한다.",
  o:["255","1","100","50"],a:2,
  why:"L*는 0(검정)부터 100(흰색)까지의 밝기 값이에요.",
  trap:{0:"0~255는 컴퓨터 RGB 색값이에요. L*는 0~100입니다."}},
 {type:"객관식",lv:"상",q:"보습크림을 측정했더니 제조 직후 L* 92, a* −0.5, b* 3 → 보관 후 L* 88, a* +0.5, b* 9 였어요. 가장 알맞은 해석은?",
  o:["밝아지고 파란 쪽으로 변했다","어두워지고 노란 쪽으로 변했다 (황변)","어두워지고 초록 쪽으로 변했다","밝아지고 붉은 쪽으로 크게 변했다"],a:1,
  why:"L*가 92→88로 줄어 어두워졌고, b*가 3→9로 가장 크게 늘어 노란 쪽으로 변했어요.",
  trap:{3:"a*는 부호만 바뀌었을 뿐 변화량은 1로 작아요. 그리고 L*가 줄었으니 '밝아진' 것도 아니에요."}},
 {type:"괄호넣기",lv:"중",q:"기준 색과 비교 색이 얼마나 다른지를 두 점 사이의 '거리' 하나의 숫자로 나타낸 값을 (　　　)(이)라고 하며, 기호로 ΔE로 쓴다.",
  o:["명도차","색차","채도","파장"],a:1,
  why:"L*, a*, b* 세 방향의 차이를 합쳐 하나의 거리로 나타낸 것이 색차(ΔE)예요.",
  trap:{0:"명도차(ΔL*)는 밝기 한 방향의 차이일 뿐, 색차의 일부예요."}},
 {type:"객관식",lv:"상",q:"두 시료의 차이가 ΔL* = 3, Δa* = 0, Δb* = 4 일 때, 색차 ΔE는?",
  formula:"ΔE* = √( ΔL*² + Δa*² + Δb*² )",
  o:["7","5","12","25"],a:1,
  why:"√(3² + 0² + 4²) = √(9 + 16) = √25 = 5 예요.",
  trap:{0:"3+0+4를 그냥 더하면 7이에요. 제곱해서 더한 뒤 루트를 씌워야 해요.",3:"9+16=25 에서 멈췄네요. 마지막에 루트(√)를 씌워야 해요."}},
 {type:"객관식",lv:"중",q:"색의 3속성 중 '얼마나 선명한가(물 탄 주스 vs 원액)'를 나타내는 것은?",
  o:["색상","명도","채도","파장"],a:2,
  why:"채도는 선명함(진하기), 명도는 밝기, 색상은 색의 종류예요.",
  trap:{1:"명도는 '밝다/어둡다'예요. '선명하다/흐리다'는 채도입니다."}},
 {type:"괄호넣기",lv:"중",q:"시럽·점안제처럼 맑은 액체는 빛이 통과한 양을 재는 ( ① ) 측정을, 보습크림·정제처럼 불투명한 시료는 튕겨 나온 빛을 재는 ( ② ) 측정을 한다.",
  o:["① 반사  ② 투과","① 흡수  ② 반사","① 투과  ② 흡수","① 투과  ② 반사"],a:3,
  why:"빛이 통과하는 맑은 시료는 투과, 통과하지 못하는 불투명 시료는 반사로 재요.",
  trap:{0:"순서가 바뀌었어요. '통과한 빛 = 투과', '튕긴 빛 = 반사'로 단어 뜻과 연결해 보세요."}},
 {type:"객관식",lv:"상",q:"색도 측정값을 믿기 어렵게 만드는 경우가 아닌 것은?",
  o:["시료에 기포가 섞인 채로 측정했다","측정 전 표준판 보정을 하지 않았다","같은 광원·시야 조건으로 여러 번 재서 평균을 냈다","시료를 너무 얇게 담아 용기 바닥 색이 비쳤다"],a:2,
  why:"조건을 통일하고 여러 번 재서 평균을 내는 것은 올바른 측정 방법이에요.",
  trap:{3:"시료가 얇으면 용기 바닥 색이 섞여 값이 달라져요. 두께도 중요한 조건이에요."}},
 {type:"괄호넣기",lv:"중",q:"반사 방식 색차계로 측정하기 전에는 (　　　)(으)로 기기를 보정(Calibration)해야 한다.",
  o:["백색 표준판","증류수","투명 유리판","측정할 시료"],a:0,
  why:"기준이 되는 흰색을 먼저 기기에 알려줘야 정확해요. 저울의 영점 맞추기와 같은 개념이에요.",
  trap:{1:"증류수는 흡광도 측정(분광광도계)의 바탕 보정과 헷갈린 경우예요."}},
 {type:"객관식",lv:"상",q:"색을 사람 눈으로만 판단하면 안 되는 이유로 옳지 않은 것은?",
  o:["조명에 따라 같은 시료도 다르게 보인다","사람마다 색을 느끼는 정도가 다르다","오래 보면 눈이 적응해 작은 차이를 놓친다","사람의 눈은 색의 차이를 전혀 구분하지 못한다"],a:3,
  why:"눈은 색 차이를 구분할 수 있어요. 다만 조건·사람에 따라 흔들려서 숫자로 재는 거예요.",
  trap:{2:"눈의 적응(피로)도 눈으로만 판단하면 안 되는 이유 중 하나예요."}}
];

const N = ["①","②","③","④"];
const POINT = 10, RETRY_POINT = 5;
let score = 0, round = [], idx = 0, first = {}, retryMode = false, retryRes = {};
const $ = id => document.getElementById(id);

function chips(){
  const box = $("chips"); box.innerHTML = "";
  Q.forEach((_,i)=>{
    const c = document.createElement("div"); c.className = "chip";
    const res = retryMode && retryRes[i] !== undefined ? retryRes[i] : first[i];
    if(res === true) c.classList.add("ok"); else if(res === false) c.classList.add("no");
    if(round[idx] === i && !$("stage").dataset.done) c.classList.add("now");
    box.appendChild(c);
  });
  const done = round.length;
  $("progLabel").innerHTML = retryMode
    ? `다시 풀기 <strong>${Math.min(idx+1,done)}</strong> / ${done} 문항`
    : `<strong>${Math.min(idx+1,10)}</strong> / 10 문항`;
  const ok = Q.filter((_,i)=> (retryRes[i]===true) || first[i]===true).length;
  $("okCount").textContent = `맞힌 문항 ${ok}`;
}

function addScore(p, el){
  score += p; $("score").textContent = score;
  const box = $("scoreBox"); box.classList.remove("bump"); void box.offsetWidth; box.classList.add("bump");
  const r = el.getBoundingClientRect(); const s = document.createElement("div");
  s.className = "plus"; s.textContent = "+" + p; s.style.left = (r.right - 40) + "px"; s.style.top = (r.top) + "px";
  document.body.appendChild(s); setTimeout(()=>s.remove(), 900);
}

function show(){
  const stage = $("stage"); delete stage.dataset.done;
  const qi = round[idx], q = Q[qi];
  stage.innerHTML = `
   <article class="card">
     <div class="tags"><span class="tag">문항 ${qi+1}</span><span class="tag">${q.type}</span><span class="tag ${q.lv==='상'?'hi':''}">난이도 ${q.lv}</span></div>
     <p class="q">${q.q}</p>
     ${q.formula?`<div class="formula">${q.formula}</div>`:`<p class="hint">알맞은 답을 눌러 보세요.</p>`}
     <div class="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i}"><span class="n">${N[i]}</span><span>${t}</span></button>`).join("")}</div>
     <div class="fb" id="fb" role="status"></div>
     <div class="actions"><button class="btn primary" id="next" hidden>${idx===round.length-1?"결과 보기":"다음 문항"}</button></div>
   </article>`;
  stage.querySelectorAll(".opt").forEach(b=> b.onclick = ()=> answer(+b.dataset.i, b));
  $("next").onclick = ()=>{ idx++; idx < round.length ? show() : result(); window.scrollTo({top:0}); };
  chips();
}

function answer(i, btn){
  const qi = round[idx], q = Q[qi], ok = i === q.a;
  document.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add("correct");
    else if(j===i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(retryMode) retryRes[qi] = ok; else first[qi] = ok;
  if(ok) addScore(retryMode?RETRY_POINT:POINT, $("scoreBox"));
  const fb = $("fb");
  fb.className = "fb show " + (ok?"ok":"no");
  const tip = !ok ? (q.trap[i] || `정답은 ${N[q.a]} ${q.o[q.a]} 이에요.`) : "";
  fb.innerHTML = `<b class="v">${ok?"정답이에요! +"+(retryMode?RETRY_POINT:POINT)+"점":"아쉬워요, 정답은 "+N[q.a]+" 입니다"}</b>${q.why}${tip?`<div class="tip">헷갈린 포인트 · ${tip}</div>`:""}`;
  const nx = $("next"); nx.hidden = false; nx.focus({preventScroll:true});
  chips();
}

function result(){
  const stage = $("stage"); stage.dataset.done = "1";
  const firstOk = Q.filter((_,i)=>first[i]).length;
  const wrong = Q.map((_,i)=>i).filter(i => !first[i] && retryRes[i] !== true);
  const msg = wrong.length===0 ? "모든 문항을 해결했어요. 14주차 색도 실습 준비 완료!"
            : firstOk>=7 ? "잘했어요! 틀린 문항만 다시 풀어서 완성해 봐요."
            : "괜찮아요. 해설을 보고 틀린 문항을 다시 풀어 보세요.";
  stage.innerHTML = `
   <article class="card result">
     <h2>${retryMode?"다시 풀기 결과":"결과"}</h2>
     <div class="big">${score}<small> 포인트</small></div>
     <p class="msg">첫 도전 ${firstOk} / 10 문항 정답 · ${msg}</p>
     <ul class="list">${Q.map((q,i)=>{
        const ok = first[i] || retryRes[i]===true;
        const label = first[i] ? "" : (retryRes[i]===true ? " (다시 풀기 성공)" : "");
        return `<li><span class="mark ${ok?"ok":"no"}">${ok?"○":"×"}</span><span>${i+1}. ${q.q.length>46?q.q.slice(0,46)+"…":q.q}${label}<br><span class="ans">정답 ${N[q.a]} ${q.o[q.a]}</span></span></li>`;}).join("")}</ul>
     <div class="actions">
       <button class="btn ghost" id="restart">처음부터 다시</button>
       <button class="btn primary" id="retry" ${wrong.length?"":"hidden"}>틀린 문항만 다시 풀기 (${wrong.length})</button>
     </div>
     ${wrong.length?`<p class="retry-note">다시 풀기에서 맞히면 +${RETRY_POINT}점을 받아요.</p>`:""}
   </article>`;
  $("restart").onclick = start;
  $("retry").onclick = ()=>{ retryMode = true; round = wrong; idx = 0; show(); window.scrollTo({top:0}); };
  chips();
  $("progLabel").innerHTML = "<strong>완료</strong>";
}

function start(){
  score = 0; first = {}; retryRes = {}; retryMode = false; idx = 0;
  round = Q.map((_,i)=>i); $("score").textContent = "0"; show(); window.scrollTo({top:0});
}
start();
</script>
</body>
</html>
